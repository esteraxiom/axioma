title: Axioma Setup
screens:
  - title: "Welcome to Axioma"
    description: "COSMIC, niri, and a Bazzite-derived gaming foundation"
    actions:
      - id: "status"
        title: "Inspect system status"
        description: "Show the booted image, kernel, NVIDIA driver, update state and sessions."
        default: false
        script: "ujust axioma-status"
      - id: "sessions"
        title: "Understand the sessions"
        description: "Axioma COSMIC on niri is the default. Native COSMIC and standalone niri remain recovery choices in the greeter."
        default: false
        script: "yad --info --title='Axioma sessions' --text='Axioma COSMIC on niri: integrated default\nCOSMIC: native recovery session\nniri: standalone DMS/Vicinae session'"
  - title: "Migrate this workstation"
    description: "Mount existing data and selectively import the old CachyOS home"
    actions:
      - id: "mount-data"
        title: "Configure Mega Storage and Storage"
        description: "Validate their UUIDs and add safe, nofail mounts at the existing /mnt paths."
        default: false
        script: "ujust axioma-mount-data"
      - id: "migrate-home"
        title: "Selectively migrate CachyOS home"
        description: "Mount the old @home subvolume read-only and copy personal data plus niri, DMS and Vicinae configuration."
        default: false
        script: "ujust axioma-migrate-home"
  - title: "Optional services"
    description: "Nothing network-facing is enabled until selected"
    actions:
      - id: "sunshine"
        title: "Sunshine game streaming"
        description: "Install Sunshine from Flathub and enable its user service."
        default: false
        script: "ujust axioma-setup-sunshine enable"
      - id: "waydroid"
        title: "Waydroid"
        description: "Initialize and enable the Android container."
        default: false
        script: "ujust axioma-setup-waydroid enable"
      - id: "tailscale"
        title: "Tailscale"
        description: "Enable the daemon; authentication remains interactive."
        default: false
        script: "ujust axioma-setup-tailscale enable"
      - id: "cockpit"
        title: "Cockpit"
        description: "Enable the local web administration socket."
        default: false
        script: "ujust axioma-setup-cockpit enable"
      - id: "virtualization"
        title: "Virtualization"
        description: "Enable libvirt and add the current user to the libvirt group."
        default: false
        script: "ujust axioma-setup-virtualization enable"

