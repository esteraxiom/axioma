name: Sign existing image digest

on:
  workflow_dispatch:
    inputs:
      digest:
        description: OCI digest to sign (sha256:...)
        required: true
        type: string

permissions: {}

jobs:
  sign:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/esteraxiom/axioma
      IMAGE_DIGEST: ${{ inputs.digest }}
    steps:
      - name: Validate digest
        run: |
          [[ $IMAGE_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Log in to GHCR
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | \
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign image digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$IMAGE@$IMAGE_DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ inputs.digest }}
          push-to-registry: true
