name: Promote tested digest

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Tested sha256 digest from the testing image"
        required: true
        type: string
      release_tag:
        description: "Release tag, for example v2026.08.11"
        required: true
        type: string

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out public key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate inputs
        env:
          DIGEST: ${{ inputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ $RELEASE_TAG =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}([.-][0-9]+)?$ ]]

      - name: Install registry tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Verify testing digest and promote without rebuilding
        env:
          DIGEST: ${{ inputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/axioma
          cosign verify --key cosign.pub "$image@$DIGEST"
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy --all "docker://$image@$DIGEST" "docker://$image:stable"
          skopeo copy --all "docker://$image@$DIGEST" "docker://$image:${RELEASE_TAG#v}"

  iso:
    needs: promote
    uses: ./.github/workflows/build-iso.yml
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    with:
      image_tag: stable
      release_tag: ${{ inputs.release_tag }}
      publish_release: true
    secrets: inherit

