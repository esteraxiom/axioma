name: Build installer ISO

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      publish_release:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      image_tag:
        description: "OCI tag to embed"
        default: stable
        required: true
        type: string
      release_tag:
        description: "Release tag for uploaded files"
        default: v0.0.0-test
        required: true
        type: string
      publish_release:
        description: "Create/update a GitHub release"
        default: false
        required: true
        type: boolean

concurrency:
  group: iso-${{ inputs.image_tag }}
  cancel-in-progress: true

permissions: {}

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free runner disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Prepare Btrfs container storage
        run: |
          sudo truncate -s 70G /mnt/axioma-podman.img
          sudo mkfs.btrfs -f /mnt/axioma-podman.img
          sudo systemctl stop podman.service 2>/dev/null || true
          sudo mount -o compress-force=zstd:2 /mnt/axioma-podman.img /var/lib/containers/storage

      - name: Log in to GHCR
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | \
            sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build live installer container
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/axioma:${{ inputs.image_tag }}
          sudo podman build --cap-add sys_admin --security-opt label=disable \
            --build-arg "BASE_IMAGE=$image" \
            --build-arg "INSTALL_IMAGE_PAYLOAD=$image" \
            --tag localhost/axioma-installer:latest \
            --file installer/Containerfile .

      - name: Build ISO
        id: build
        uses: Zeglius/titanoboa@7737f4748458252ac827dca14b3d6dd09298472a
        with:
          image-ref: localhost/axioma-installer:latest
          iso-dest: axioma-${{ inputs.release_tag }}-nvidia-open-x86_64.iso

      - name: Prepare signed artifacts
        id: artifacts
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-dest }}
        run: |
          mkdir upload
          mv "$ISO_PATH" upload/
          cd upload
          sha256sum "$(basename "$ISO_PATH")" >"$(basename "$ISO_PATH").sha256"
          echo "path=$PWD/$(basename "$ISO_PATH")" >>"$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign ISO
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign-blob -y --key env://COSIGN_PRIVATE_KEY \
            '${{ steps.artifacts.outputs.path }}' \
            --bundle '${{ steps.artifacts.outputs.path }}.bundle'

      - name: Attest ISO provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: upload/*.iso

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axioma-${{ inputs.release_tag }}-installer
          path: upload/
          compression-level: 0

      - name: Publish GitHub release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view '${{ inputs.release_tag }}' >/dev/null 2>&1 || \
            gh release create '${{ inputs.release_tag }}' --title 'Axioma ${{ inputs.release_tag }}' \
              --notes 'Promoted Axioma image and NVIDIA-open x86_64 installer.'
          gh release upload '${{ inputs.release_tag }}' upload/* --clobber
